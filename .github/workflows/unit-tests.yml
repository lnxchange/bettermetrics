name: Unit tests

# Site checks in scripts/*.test.ts, including the testing-status parser and
# the basis-link resolver. The CRM vitest suite is separate.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit:
    name: scripts/*.test.ts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
