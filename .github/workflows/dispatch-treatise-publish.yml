name: Dispatch treatise publish

# After bettermetrics main deploys to Vercel production, trigger the
# aim-treatise "Publish treatise to website" workflow so the live site
# syncs glossary, chapters and cache from the commit that is actually live.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dispatch-treatise-publish
  cancel-in-progress: true

env:
  VERCEL_PROJECT_ID: prj_xIOsq7oNKYobDGdBEG5L3Q7vsC0A
  VERCEL_TEAM_ID: team_T6k1ldIUXFXt6J1HsBksNBzy
  TREATISE_WORKFLOW: publish-to-website.yml

jobs:
  dispatch:
    name: Wait for Vercel, dispatch aim-treatise
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Skip when TREATISE_PUBLISH_TOKEN is not configured
        env:
          TREATISE_PUBLISH_TOKEN: ${{ secrets.TREATISE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TREATISE_PUBLISH_TOKEN}" ]; then
            echo "::notice title=Treatise publish skipped::TREATISE_PUBLISH_TOKEN is not set on this repository. Add the fine-grained PAT as a repository secret to dispatch aim-treatise after production deploys."
            echo "skip=true" >> "$GITHUB_ENV"
          else
            echo "skip=false" >> "$GITHUB_ENV"
          fi

      - name: Wait for Vercel production deployment
        if: env.skip != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "::notice title=Treatise publish skipped::VERCEL_TOKEN is not set; cannot confirm the production deployment for ${GITHUB_SHA}. Skipping aim-treatise dispatch."
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi

          deadline=$((SECONDS + 2100))
          poll=30
          api="https://api.vercel.com/v6/deployments?teamId=${VERCEL_TEAM_ID}&projectId=${VERCEL_PROJECT_ID}&target=production&sha=${GITHUB_SHA}&limit=5"

          echo "Waiting for Vercel production deployment of commit ${GITHUB_SHA}…"
          while [ "$SECONDS" -lt "$deadline" ]; do
            body=$(curl -fsS -H "Authorization: Bearer ${VERCEL_TOKEN}" -H "Accept: application/json" "$api")
            state=$(echo "$body" | jq -r '
              [.deployments[]? | .readyState // .state // empty]
              | if length == 0 then "BUILDING"
                elif any(. == "READY") then "READY"
                elif any(. == "ERROR" or . == "CANCELED") then (.[0])
                else (.[0] // "BUILDING")
                end
            ')

            case "$state" in
              READY)
                url=$(echo "$body" | jq -r '[.deployments[]? | select((.readyState // .state) == "READY") | .url] | first // empty')
                echo "Production deployment is READY${url:+ (${url})}."
                exit 0
                ;;
              ERROR|CANCELED)
                echo "::error::Vercel production deployment for ${GITHUB_SHA} ended with state ${state}. Not dispatching aim-treatise."
                exit 1
                ;;
              *)
                echo "Deployment state: ${state}; checking again in ${poll}s…"
                sleep "$poll"
                ;;
            esac
          done

          echo "::error::Timed out after 35 minutes waiting for Vercel production deployment of ${GITHUB_SHA}."
          exit 1

      - name: Dispatch Publish treatise to website
        if: env.skip != 'true'
        env:
          TREATISE_PUBLISH_TOKEN: ${{ secrets.TREATISE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TREATISE_PUBLISH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/lnxchange/aim-treatise/actions/workflows/${TREATISE_WORKFLOW}/dispatches" \
            -d '{"ref":"main","inputs":{"rebuild_epub":false}}'
          echo "Dispatched aim-treatise workflow ${TREATISE_WORKFLOW} (rebuild_epub=false)."